name: Qualify the installed-package runner selection
on:
  pull_request:
    paths:
      - '.github/workflows/receive-installed-package.yml'
      - '.github/workflows/qualify-runner-selection.yml'
      - '.github/tests/**'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix .github/tests --ignore-scripts --no-audit --no-fund
      - run: node --test .github/tests/*.test.mjs
