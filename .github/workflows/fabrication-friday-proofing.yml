name: Fabrication Friday source receiving
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
concurrency:
  group: fabrication-friday-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  native-source-receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the frozen development and runtime closure
        run: corepack pnpm@11.28.5 install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - name: Verify the projected package and source enrollment
        run: |
          node scripts/sync-package-manifest.mjs --check-pnpm-root
          node scripts/run-package-tests.mjs --check-receiving-enrollment
          npm run check:generated
          npm test
      - name: Exercise the installed package as a downstream developer
        run: |
          consumer="$RUNNER_TEMP/jsnode-consumer"
          mkdir "$consumer"
          archive=$(npm pack --ignore-scripts --silent --pack-destination "$consumer")
          cp .npmrc "$consumer/.npmrc"
          cd "$consumer"
          git init --quiet
          echo '{"private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "./$archive"
          cd node_modules/@red-cup-engineering/jsnode-package-engineering-services-section
          node scripts/run-package-tests.mjs --receiving
          npm run check:generated
