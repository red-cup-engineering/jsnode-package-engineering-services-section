name: JSNode proof-stage native receiving
on:
  pull_request:
    paths:
      - 'src/assay-completion.mjs'
      - 'test/assay-completion.test.mjs'
      - '.github/workflows/assay-proof-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/assay-completion.mjs'
      - 'test/assay-completion.test.mjs'
      - '.github/workflows/assay-proof-native.yml'
permissions:
  contents: read
jobs:
  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Refuse checkout authorization surviving into proof tests
        shell: bash
        run: |
          if git config --local --name-only --get-regexp '^http\\..*\\.extraheader
        with:
          node-version: '24'
      - name: Syntax of the original proof-stage receiver
        run: node --check src/assay-completion.mjs
      - name: Execute original complete TAP proof receiving regression suite
        run: node --test test/assay-completion.test.mjs
 >/dev/null 2>&1; then
            echo '::error::Checkout retained GitHub HTTP authorization in .git/config'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Syntax of the original proof-stage receiver
        run: node --check src/assay-completion.mjs
      - name: Execute original complete TAP proof receiving regression suite
        run: node --test test/assay-completion.test.mjs
