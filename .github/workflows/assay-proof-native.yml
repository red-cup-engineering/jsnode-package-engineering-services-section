name: JSNode proof-stage native receiving
on:
  pull_request:
    paths:
      - 'src/package-*.mjs'
      - 'src/sync-package-manifest.mjs'
      - 'scripts/sync-package-manifest.mjs'
      - 'test/sync-package-manifest-custody.test.mjs'
      - 'pnpm-lock.yaml'
      - 'src/workspace/pnpm-lockfile.mjs'
      - 'test/pnpm-root-lock-receiving.test.mjs'
      - 'scripts/run-package-tests.mjs'
      - 'src/assay-completion.mjs'
      - 'test/assay-completion.test.mjs'
      - 'package.json'
      - 'test/package-receiving.test.mjs'
      - '.npmignore'
      - '.github/workflows/assay-proof-native.yml'
  push:
    branches: [main, 'fix/**']
    paths:
      - 'src/package-*.mjs'
      - 'src/sync-package-manifest.mjs'
      - 'scripts/sync-package-manifest.mjs'
      - 'test/sync-package-manifest-custody.test.mjs'
      - 'pnpm-lock.yaml'
      - 'src/workspace/pnpm-lockfile.mjs'
      - 'test/pnpm-root-lock-receiving.test.mjs'
      - 'scripts/run-package-tests.mjs'
      - 'src/assay-completion.mjs'
      - 'test/assay-completion.test.mjs'
      - 'package.json'
      - 'test/package-receiving.test.mjs'
      - '.npmignore'
      - '.github/workflows/assay-proof-native.yml'
permissions:
  contents: read
jobs:
  source-proof:
    name: Receive the original assay completion contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test test/assay-completion.test.mjs
