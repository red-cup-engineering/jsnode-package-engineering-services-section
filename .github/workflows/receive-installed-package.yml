name: Receive an installed Group package
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/receive-installed-package.yml'
permissions:
  contents: read
jobs:
  receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Exercise every enrolled test against the independently installed archive
        shell: bash
        run: |
          set -euo pipefail
          receiver=$(mktemp -d)
          artifact=$(npm pack --offline --ignore-scripts --silent --pack-destination "$receiver")
          name=$(node -p 'require("./package.json").name')
          printf '%s\n' '{"private":true}' > "$receiver/package.json"
          (cd "$receiver" && npm install --registry=https://registry.561.group/ --ignore-scripts --no-audit --no-fund \
            "./$artifact" @red-cup-engineering/jsnode-package-engineering-services-section@0.6.6-dev.0)
          runner="$receiver/node_modules/.bin/run-package-tests"
          "$runner" --check-receiving-enrollment
          PACKAGE_TEST_DIRECTORY="$receiver/node_modules/$name" "$runner" --receiving --test-concurrency=2
